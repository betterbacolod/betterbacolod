name: fuel-prices-refresh

# Pulls the latest DOE Visayas weekly retail-pump-price PDF and opens a PR if
# the JSON has new data. Cron runs Tuesday morning PHT (when DOE typically
# publishes) plus three days of grace if they're late.

on:
  schedule:
    # Tue–Fri at 01:00 UTC = 09:00 PHT
    - cron: '0 1 * * 2-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - id: fetch
        name: Fetch and merge latest DOE report
        run: |
          set +e
          python3 scripts/fetch-doe-fuel-prices.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Detect JSON change
        id: diff
        if: steps.fetch.outputs.exit_code == '0'
        run: |
          if git diff --quiet src/data/transparency/fuel-prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the new week's data
        if: steps.fetch.outputs.exit_code == '0' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # Deterministic branch keyed off the report date so the same week
          # always lands on the same branch (PR is updated in place rather
          # than spawning a duplicate every day).
          branch: auto/fuel-prices-${{ steps.fetch.outputs.report_date }}
          base: main
          commit-message: 'content(fuel-prices): auto-update from DOE for week of ${{ steps.fetch.outputs.report_date }}'
          title: 'content(fuel-prices): auto-update from DOE for week of ${{ steps.fetch.outputs.report_date }}'
          body: |
            🤖 Auto-generated by `.github/workflows/fuel-prices-refresh.yml`.

            **Week**: ${{ steps.fetch.outputs.report_date }} (Tuesday → Monday)

            Source: DOE Visayas Field Office weekly retail-pump-price report
            (`https://prod-cms.doe.gov.ph/documents/d/guest/vfo-price-monitoring-MMDDYY-pdf`).

            Review the JSON diff for any anomalies before merging:
            - Spot-check the latest week's prices vs. the source PDF
            - Confirm no fuel type has unexpected coverage drops
            - If a brand's price looks off (e.g. `0 - X` junk), flag it on the PR

            release-please will pick this up as a `content` commit and propose
            the next version bump.
          labels: |
            auto-generated
            content/fuel-prices

      - name: Open issue on parse failure
        if: steps.fetch.outputs.exit_code == '1'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'fuel-prices auto-refresh: parse error'
          content-filepath: /tmp/doe-pdfs/error.log
          labels: |
            auto-generated
            bug

      - name: Open issue on network error
        if: steps.fetch.outputs.exit_code == '2'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'fuel-prices auto-refresh: network or upstream error'
          content-filepath: /tmp/doe-pdfs/error.log
          labels: |
            auto-generated
            bug

      - name: Note when DOE has not yet published
        if: steps.fetch.outputs.exit_code == '78'
        run: |
          echo "DOE has not yet published this week's PDF — workflow will retry tomorrow."
