name: fuel-prices-refresh

# Pulls the latest DOE Visayas weekly retail-pump-price PDF and opens a PR if
# the JSON has new data. Cron runs Tuesday morning PHT (when DOE typically
# publishes) plus three days of grace if they're late.

on:
  schedule:
    # Tue–Fri at 01:00 UTC = 09:00 PHT
    - cron: '0 1 * * 2-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - id: fetch
        name: Fetch and merge missing DOE reports
        run: |
          set +e
          python3 scripts/fetch-doe-fuel-prices.py --catch-up-weeks 8
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Detect JSON change
        id: diff
        if: steps.fetch.outputs.exit_code == '0'
        run: |
          if git diff --quiet src/data/transparency/fuel-prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with new fuel-price data
        if: steps.fetch.outputs.exit_code == '0' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # Deterministic branch keyed off the latest imported report date so
          # repeated runs update the same catch-up PR instead of spawning
          # duplicates.
          branch: auto/fuel-prices-${{ steps.fetch.outputs.report_date }}
          base: main
          # Use `fix:` prefix so release-please cuts a patch bump for each
          # weekly data refresh. (`content:` is a custom type and release-please
          # only triggers releases on feat/fix/BREAKING — using fix here keeps
          # the auto-pipeline end-to-end without a custom plugin.)
          commit-message: 'fix(fuel-prices): auto-update from DOE through ${{ steps.fetch.outputs.report_date }}'
          title: 'fix(fuel-prices): auto-update from DOE through ${{ steps.fetch.outputs.report_date }}'
          body: |
            🤖 Auto-generated by `.github/workflows/fuel-prices-refresh.yml`.

            **Latest imported week**: ${{ steps.fetch.outputs.report_date }} (Tuesday → Monday)

            Source: DOE Visayas Field Office weekly retail-pump-price report
            (`https://prod-cms.doe.gov.ph/documents/d/guest/vfo-price-monitoring-MMDDYY-pdf`).

            Catch-up summary:
            - Weeks checked: ${{ steps.fetch.outputs.checked_weeks }}
            - Not yet published / runner-blocked: ${{ steps.fetch.outputs.not_published }}
            - Parse errors: ${{ steps.fetch.outputs.parse_errors }}
            - Network errors: ${{ steps.fetch.outputs.network_errors }}

            Review the JSON diff for any anomalies before merging:
            - Spot-check the latest week's prices vs. the source PDF
            - Confirm no fuel type has unexpected coverage drops
            - If a brand's price looks off (e.g. `0 - X` junk), flag it on the PR

            release-please will pick this up as a `content` commit and propose
            the next version bump.
          labels: |
            auto-generated
            content/fuel-prices

      - name: Open issue on parse failure
        if: steps.fetch.outputs.parse_errors != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'fuel-prices auto-refresh: parse error'
          content-filepath: /tmp/doe-pdfs/error.log
          labels: |
            auto-generated
            bug

      - name: Open issue on network error
        if: steps.fetch.outputs.network_errors != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'fuel-prices auto-refresh: network or upstream error'
          content-filepath: /tmp/doe-pdfs/error.log
          labels: |
            auto-generated
            bug

      - name: Note when DOE has not yet published
        if: steps.fetch.outputs.not_published != '0'
        run: |
          echo "Some DOE PDFs are not published yet or blocked this runner — workflow will retry on the next schedule."
