name: bacolod-flights-refresh

on:
  schedule:
    # 16:05 UTC is 00:05 PHT, keeping the timetable aligned to local dates.
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bacolod-flights-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch Aviationstack BCD snapshot
        env:
          AVIATIONSTACK_ACCESS_KEY: ${{ secrets.AVIATIONSTACK_ACCESS_KEY }}
        run: python3 scripts/fetch-aviationstack-bacolod-flights.py

      - name: Publish a changed timetable
        run: |
          git add src/data/flights/bacolod-silay.json
          if git diff --cached --quiet; then
            echo 'No timetable changes to publish.'
            exit 0
          fi
          git config user.name 'betterbacolod-bot[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(flights): refresh Bacolod–Silay schedule'
          git push origin HEAD:main
